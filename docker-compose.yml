version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getgrant2_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: true

      DB_CONNECTION: pgsql
      DB_HOST: postgres2       # теперь локальная база
      DB_PORT: 5432
      DB_DATABASE: getgrant2_db
      DB_USERNAME: getgrant2_user
      DB_PASSWORD: secret
    command: >
      sh -c "php artisan config:clear &&
             php artisan cache:clear &&
             php artisan migrate:fresh --seed &&
             php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - getgrant2_network

  postgres2:
    image: postgres:16
    container_name: getgrant2_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: getgrant2_db
      POSTGRES_USER: getgrant2_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"  # чтобы можно было подключаться из DBeaver
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - getgrant2_network

  node:
    image: node:22
    container_name: getgrant2_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["npm", "run", "dev"]
    ports:
      - "5174:5173"
    networks:
      - getgrant2_network

networks:
  getgrant2_network:
    driver: bridge

volumes:
  pgdata2:
