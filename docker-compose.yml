version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getgrant2_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: pgsql
      DB_HOST: postgres2
      DB_PORT: 5432
      DB_DATABASE: getgrant2_db
      DB_USERNAME: getgrant2_user
      DB_PASSWORD: secret
    depends_on:
      postgres2:
        condition: service_healthy
    networks:
      - getgrant2_network

  nginx:
    image: nginx:alpine
    container_name: getgrant2_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - getgrant2_network

  postgres2:
    image: postgres:16
    container_name: getgrant2_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: getgrant2_db
      POSTGRES_USER: getgrant2_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getgrant2_user -d getgrant2_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - getgrant2_network

  node:
    image: node:22
    container_name: getgrant2_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: npm run dev
    ports:
      - "5174:5173"
    networks:
      - getgrant2_network

networks:
  getgrant2_network:
    driver: bridge

volumes:
  pgdata2:
